name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    name: Testes (Jest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerenciador_projetos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gerenciador_projetos_test?schema=public
      # Segredo usado só nos testes (a API exige pelo menos 32 caracteres)
      JWT_SECRET: segredo-usado-somente-nos-testes-do-ci-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
